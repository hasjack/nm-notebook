name: Hire

on:
  pull_request:
  push:
    branches: [note/lemma8-proof-map, lean/gold-size-descent]
  workflow_dispatch:

jobs:
  build:
    name: lake build Hire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: "true"
          build-args: Hire
          use-mathlib-cache: "true"
