# halfasecond.com — nm-notebook static SPA
# Unknown paths 301 to /. Do not touch cdn. / api. / other vhosts.
#
# root lives at /var/www/cdn/halfasecond (jack-writable).
# Swap: sudo cp this fragment into the halfasecond.com 443 server
# in /etc/nginx/sites-enabled/default, replacing the proxy_pass :5165
# location, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name halfasecond.com www.halfasecond.com;

    ssl_certificate     /etc/letsencrypt/live/halfasecond.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/halfasecond.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/cdn/halfasecond;
    index index.html;

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /paper/ {
        try_files $uri =404;
    }

    location ^~ /figures/ {
        try_files $uri =404;
    }

    location ^~ /toys/flockers/ {
        try_files $uri =404;
    }

    location = /favicon.svg { try_files $uri =404; }
    location = /icons.svg { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    location = / {
        try_files /index.html =404;
    }

    location = /paper {
        try_files /index.html =404;
    }

    # Notebook client routes. Anything else (old On Gravity paths) 301 home.
    location ~ ^/(hire|basins|islands|corridor|microscope|certificates|certs|hire-spectrum|hire-lab|zeta-doors|rank100|gaussian-doors|two-class|door-coverage|coverage-lattice|cube-doors|door-waits|power-firing|ingredient-transitions|alphabet|alphabet-spiral|walk|lock-i|lock-pi|lock|free|magnitude|beacons|beacon-super|rotation|physics|basel|analysis-[1-5]|solve|catalogue|primes|super-primes|unclaimed|suspect-bench|missed|spectrum|pm1|signed-doors|count|when-gold-disconnects|toys/bell|toys/atlas|toys/flockers|notes|notes/hire-graph|notes/when-gold-disconnects|notes/natural-mathematics-bell-toy|notes/switching-quadratic-atlas-diagnostics|notes/zeta-doors|alphabet/notes)/?$ {
        try_files /index.html =404;
    }

    location / {
        return 301 /;
    }
}
